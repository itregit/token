<!DOCTYPE html>
<html>
<head>
  <title>Transfer ERC20</title>
</head>
<body>

<button onclick="sendTokens()">Send 10 Tokens</button>

<p id="result"></p>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>

<script>

const tokenAddress = "0x3C5eB10543b069AEED7df3A6Af877cA2a8b694eA";

const recipient =
  "0x15433DA387451F9dE4565280C85506CB71aF9376";

const abi = [
  "function transfer(address to, uint256 amount) returns (bool)",
  "function decimals() view returns (uint8)"
];

async function sendTokens() {

    if (!window.ethereum) {
        alert("MetaMask not installed");
        return;
    }

    await window.ethereum.request({
        method: 'eth_requestAccounts'
    });

    const provider =
        new ethers.BrowserProvider(window.ethereum);

    const signer =
        await provider.getSigner();

    const contract =
        new ethers.Contract(
            tokenAddress,
            abi,
            signer
        );

    const decimals =
        await contract.decimals();

    const amount =
        ethers.parseUnits("10", decimals);

    const tx =
        await contract.transfer(
            recipient,
            amount
        );

    document.getElementById("result").innerText =
        "Transaction submitted: " + tx.hash;
}
</script>

</body>
</html>
